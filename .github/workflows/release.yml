name: "Release - Production Build"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (e.g., 0.1.5)'
        required: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Version Validation
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Version must be in semver format (x.y.z)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Verify version matches config
        run: |
          TAURI_VERSION=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "package.json version: $PKG_VERSION"
          echo "Tag version: ${{ steps.version.outputs.version }}"

          if [ "$TAURI_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::warning::Version mismatch: tauri.conf.json ($TAURI_VERSION) != tag (${{ steps.version.outputs.version }})"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS ARM64
            target: aarch64-apple-darwin
            runner: macos-14
            artifact_name: VidFlow-${{ needs.validate.outputs.version }}-aarch64-macos.zip
            sidecar_os: darwin-arm64
          - os: macOS x86_64
            target: x86_64-apple-darwin
            runner: macos-13
            artifact_name: VidFlow-${{ needs.validate.outputs.version }}-x86_64-macos.zip
            sidecar_os: darwin-x64
          - os: Linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: VidFlow-${{ needs.validate.outputs.version }}-amd64-linux.deb
            sidecar_os: linux-x64
          - os: Windows
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            artifact_name: VidFlow-${{ needs.validate.outputs.version }}-x64-setup.exe
            sidecar_os: win32-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            target/
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.target }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        if: matrix.os == 'Linux'
        run: |
          # CI prerequisites: GTK/GDK deps are required by Tauri (gdk-sys) on Linux
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip \
            gnupg

      - name: Download sidecar binaries
        shell: bash
        run: ./scripts/ci-sidecars.sh "${{ matrix.target }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Import Developer ID Certificate
        if: startsWith(matrix.os, 'macOS')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o certificate.p12
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain

      - name: Sign macOS app
        if: startsWith(matrix.os, 'macOS')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          codesign --force --deep --options runtime --sign "$APPLE_SIGNING_IDENTITY" --entitlements src-tauri/entitlements.plist "$APP_PATH"

      - name: Submit to Apple Notary
        if: startsWith(matrix.os, 'macOS')
        env:
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          ditto -c -k --keepParent "$APP_PATH" VidFlow.zip
          xcrun notarytool submit VidFlow.zip --team-id "$APPLE_NOTARY_TEAM_ID" --apple-id "$APPLE_NOTARY_ISSUER_ID" --password "$APPLE_NOTARY_APP_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"

      - name: Import Windows Certificate
        if: matrix.os == 'Windows'
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          [System.Convert]::FromBase64String($env:WINDOWS_CERT) | Set-Content -Path certificate.pfx -Encoding Byte

      - name: Sign Windows installer
        if: matrix.os == 'Windows'
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1

      - name: Import GPG Key
        if: matrix.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import -

      - name: Sign Linux packages
        if: matrix.os == 'Linux'
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do [ -f "$deb" ] && dpkg-sig --sign builder "$deb"; done
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do [ -f "$appimage" ] && gpg --batch --yes --detach-sign "$appimage"; done

      - name: Create macOS ZIP artifact
        if: startsWith(matrix.os, 'macOS')
        run: |
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          cp -R "$APP_PATH" VidFlow.app
          xattr -dr com.apple.quarantine VidFlow.app || true
          chmod -R +x VidFlow.app/Contents/MacOS/*
          zip -r ${{ matrix.artifact_name }} VidFlow.app

      - name: Create Windows artifact
        if: matrix.os == 'Windows'
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe ${{ matrix.artifact_name }}

      - name: Create Linux artifact
        if: matrix.os == 'Linux'
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb ${{ matrix.artifact_name }} 2>/dev/null || true

      - name: Generate SHA256 checksums
        run: |
          if [ -f "${{ matrix.artifact_name }}" ]; then
            sha256sum ${{ matrix.artifact_name }} > SHA256SUMS.txt
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_name }}
            SHA256SUMS.txt
          retention-days: 7

  create-release:
    name: Create Release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: "VidFlow ${{ needs.validate.outputs.version }}"
          body: |
            ## Download VidFlow v${{ needs.validate.outputs.version }}

            ### macOS
            - Apple Silicon: `VidFlow-v${{ needs.validate.outputs.version }}-aarch64-macos.zip`
            - Intel Mac: `VidFlow-v${{ needs.validate.outputs.version }}-x86_64-macos.zip`

            ### Windows
            - `VidFlow-v${{ needs.validate.outputs.version }}-x64-setup.exe`

            ### Linux
            - `VidFlow-v${{ needs.validate.outputs.version }}-amd64-linux.deb`

            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage

  cleanup:
    name: Cleanup
    needs: [create-release]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Finalize
        run: echo "Release workflow completed for version ${{ needs.validate.outputs.version }}"